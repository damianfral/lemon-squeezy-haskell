---
name: lemon-squeezy
version: 1.0.0.0

license: OtherLicense
license-file: LICENSE

dependencies:
  - aeson
  - aeson-casing
  - base
  - cryptonite
  - generic-lens
  - genvalidity
  - genvalidity-containers
  - genvalidity-text
  - genvalidity-time
  - http-media
  - http-types
  - memory
  - QuickCheck
  - relude
  - scientific
  - servant
  - servant-client
  - servant-server
  - text
  - time
  - vault
  - wai

library:
  source-dirs: ./src/

ghc-options:
  - -fwrite-ide-info
  - -Wall
  - -Wincomplete-uni-patterns
  - -Wincomplete-record-updates
  - -Wpartial-fields
  - -Widentities
  - -Wredundant-constraints
  - -Wcpp-undef
  - -Wunused-packages

tests:
  lemon-squeezy-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -rtsopts
      - -threaded
      - -with-rtsopts=-N
    dependencies:
      - genvalidity-bytestring
      - genvalidity-sydtest
      - genvalidity-sydtest-aeson
      - http-client
      - http-client-tls
      - lemon-squeezy
      - sydtest
      - sydtest-discover
      - sydtest-wai
